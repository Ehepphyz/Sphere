name: Build and Publish Sphere Releases

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            run_cmd: cmd /c build_windows.bat
            artifact: Sphere-Windows-v2026.1.0
          - os: ubuntu-latest
            run_cmd: chmod +x build_linux.sh && ./build_linux.sh
            artifact: Sphere-Linux-v2026.1.0
          - os: macos-latest
            run_cmd: chmod +x build_macos.sh && ./build_macos.sh
            artifact: Sphere-macOS-v2026.1.0

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 26
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '26'

      - name: Build Executable
        run: ${{ matrix.run_cmd }}

      - name: Compress Build Output to ZIP
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            powershell "Compress-Archive -Path dist\* -DestinationPath ${{ matrix.artifact }}.zip"
          else
            cd dist && zip -r ../${{ matrix.artifact }}.zip . && cd ..
          fi

      - name: Upload Artifacts (Internal Storage)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2026.1.0
          name: "Sphere Release v2026.1.0"
          body: "Automated multi-platform build for Sphere v2026.1.0 (Windows, Linux, macOS)."
          files: release-artifacts/*/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}