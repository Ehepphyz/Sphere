name: Build and Publish Sphere Releases

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            run_cmd: cmd /c build_windows.bat
            artifact_pattern: dist/*.msi
            artifact_name: Sphere-Windows-v2026.1.0-MSI
          - os: ubuntu-latest
            run_cmd: chmod +x build_linux.sh && ./build_linux.sh
            artifact_pattern: dist/*.deb
            artifact_name: Sphere-Linux-v2026.1.0-DEB
          - os: macos-latest
            run_cmd: chmod +x build_macos.sh && ./build_macos.sh
            artifact_pattern: dist/*.dmg
            artifact_name: Sphere-macOS-v2026.1.0-DMG

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 26
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '26'

      - name: Install WiX Toolset (Windows Only)
        if: runner.os == 'Windows'
        run: choco install wix --version 3.11.2 -y

      - name: Build Native Installer
        run: ${{ matrix.run_cmd }}

      - name: Upload Artifacts (Internal Storage)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_pattern }}

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2026.1.0
          name: "Sphere Release v2026.1.0"
          body: "Automated Release: Native installers for Windows (.msi), Linux (.deb), and macOS (.dmg)."
          files: release-artifacts/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}